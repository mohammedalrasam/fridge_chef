name: Build Flutter APK

on:
  push:
    branches: [ "main" ] # يعمل تلقائياً عند الرفع لفرع main
  workflow_dispatch: # يسمح لك بتشغيله يدوياً من الموقع

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.19.0' # يمكنك تغييرها لإصدار فلاتر الذي تستخدمه
        channel: 'stable'

    - name: Get dependencies
      run: flutter pub get

    - name: Build APK
      run: flutter build apk --release # يمكنك استخدام --debug لتسريع البناء أثناء التجربة

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release-apk
        path: build/app/outputs/flutter-apk/app-release.apk
